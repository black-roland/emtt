[target.x86_64-unknown-linux-gnu]
image = ":edge"

[target.aarch64-unknown-linux-gnu]
image = ":edge"

[target.mips-unknown-linux-musl]
image = "ghcr.io/cross-rs/mips-unknown-linux-musl:main"
build-std = true
pre-build = [
    "ln -sfn /usr/local/lib/gcc/mips-linux-muslsf/9.2.0/libgcc.a /usr/local/lib/gcc/mips-linux-muslsf/9.2.0/libunwind.a",
]

[target.mipsel-unknown-linux-musl]
image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:main"
build-std = true
pre-build = [
    "ln -sfn /usr/local/lib/gcc/mipsel-linux-muslsf/9.2.0/libgcc.a /usr/local/lib/gcc/mipsel-linux-muslsf/9.2.0/libunwind.a",
]

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"
